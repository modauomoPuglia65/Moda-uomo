<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Test Moda Uomo</title>
<style>
body{font-family:sans-serif;padding:20px;background:#f5f3ef;}
.btn{background:#b8860b;color:#fff;padding:14px 20px;border:none;border-radius:10px;font-size:16px;cursor:pointer;display:block;width:100%;margin-bottom:10px;}
.box{background:#fff;border-radius:12px;padding:16px;margin-bottom:10px;border:1px solid #ddd;}
#result{background:#e8f5e9;border-radius:10px;padding:14px;margin-top:10px;font-size:14px;display:none;}
</style>
</head>
<body>
<div class="box">
  <h2 style="color:#b8860b;margin-bottom:16px;">🧪 Test JavaScript</h2>
  <button class="btn" onclick="test1()">1. Tocca qui per testare</button>
  <button class="btn" onclick="test2()">2. Apri popup</button>
  <button class="btn" onclick="test3()">3. Salva in memoria</button>
  <div id="result"></div>
</div>

<div class="box" id="popup" style="display:none;border:2px solid #b8860b;">
  <h3>✅ Il popup funziona!</h3>
  <p>JavaScript funziona correttamente.</p>
  <button class="btn" onclick="document.getElementById('popup').style.display='none'">Chiudi</button>
</div>

<script>
function test1(){
  document.getElementById('result').style.display='block';
  document.getElementById('result').textContent='✅ JavaScript funziona! Ora prova il pulsante 2.';
}
function test2(){
  document.getElementById('popup').style.display='block';
}
function test3(){
  localStorage.setItem('test','OK');
  var v=localStorage.getItem('test');
  document.getElementById('result').style.display='block';
  document.getElementById('result').textContent='✅ LocalStorage: '+v;
}
</script>
</body>
</html>
